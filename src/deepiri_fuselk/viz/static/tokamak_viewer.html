<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <title>fuselk Tokamak Viewer</title>
  <style>
    :root {
      --bg-a: #141a2e;
      --bg-b: #080a10;
      --text: #e8ecf4;
      --muted: #7a8aaa;
      --panel: rgba(16, 20, 31, 0.82);
      --border: #2a3348;
      --accent: #4488ff;
      --core: #ff6622;
      --opoint: #ff3344;
      --radius: 12px;
      --shadow: 0 14px 40px rgba(0, 0, 0, 0.5);
      --fs-title: clamp(0.9rem, 0.8rem + 0.5vw, 1.05rem);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: radial-gradient(ellipse at 50% 30%, var(--bg-a) 0%, var(--bg-b) 70%);
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      overflow: hidden;
    }
    #hud {
      position: absolute;
      top: clamp(10px, 2vw, 16px);
      left: clamp(10px, 2vw, 16px);
      z-index: 10;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 18px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      min-width: min(240px, 60vw);
      box-shadow: var(--shadow);
    }
    #hud h2 { margin: 0 0 4px; font-size: var(--font-title); color: #fff; letter-spacing: 0.01em; }
    #hud p { margin: 0; font-size: clamp(0.68rem, 0.6rem + 0.3vw, 0.78rem); color: var(--muted); line-height: 1.5; }
    #legend { margin-top: 12px; font-size: clamp(0.68rem, 0.6rem + 0.3vw, 0.78rem); line-height: 1.8; }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
    #hud button {
      margin-top: 10px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 7px;
      padding: 6px 14px;
      font: inherit;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: filter 160ms ease, transform 160ms ease;
    }
    #hud button:hover { filter: brightness(1.12); }
    #hud button:active { transform: translateY(1px); }
    #fps {
      position: absolute;
      top: 12px;
      right: 14px;
      z-index: 10;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px;
      color: var(--muted);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 4px 10px;
      backdrop-filter: blur(6px);
    }
    @media (prefers-reduced-motion: reduce) {
      #hud button { background: transparent; border: 1px solid var(--border); }
    }
    #mode-row { margin-top: 12px; display: flex; gap: 6px; }
    #hud select {
      margin-top: 10px;
      width: 100%;
      background: #10141f;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 5px 8px;
      font: inherit;
      font-size: 0.78rem;
    }
    #status-line { margin-top: 8px; font-size: 0.7rem; color: var(--muted); line-height: 1.4; }
    #disruption-flash {
      position: absolute;
      inset: 0;
      z-index: 5;
      background: radial-gradient(ellipse at 50% 45%, rgba(255, 60, 40, 0.55) 0%, rgba(255, 60, 40, 0) 70%);
      opacity: 0;
      pointer-events: none;
      transition: opacity 90ms ease-out;
    }
    #live-layer {
      position: absolute;
      inset: 0;
      z-index: 3;
      display: none;
      background: #000;
      align-items: center;
      justify-content: center;
    }
    #live-layer.active { display: flex; }
    #live-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: contrast(1.05) saturate(1.05);
    }
    #live-empty {
      position: absolute;
      color: var(--muted);
      font-size: 0.85rem;
      text-align: center;
      max-width: 60%;
      display: none;
    }
    #live-empty.show { display: block; }
    #live-empty .big { font-size: 1.6rem; display: block; margin-bottom: 8px; }
  </style>
</head>
<body>
  <div id="hud">
    <h2>deepiri-fuselk Tokamak</h2>
    <p>3D cross-section · field line overlay · live O-point</p>
    <div id="legend">
      <div><span class="dot" style="background:#4488ff"></span>Vessel (wireframe)</div>
      <div><span class="dot" style="background:#ff6622"></span>Plasma core</div>
      <div><span class="dot" style="background:#ff3344"></span>HELIX O-point lock</div>
      <div><span class="dot" style="background:#ffcc33"></span>Divertor heat flux</div>
    </div>
    <button id="pause-btn" type="button">Pause</button>
    <div id="mode-row">
      <select id="mode-select">
        <option value="synthetic" selected>Synthetic render</option>
        <option value="live">Live camera feed</option>
      </select>
    </div>
    <div id="status-line">sim bridge: waiting…</div>
  </div>
  <div id="fps">— fps</div>
  <div id="disruption-flash"></div>
  <div id="live-layer">
    <img id="live-video" alt="Live port view feed" />
    <div id="live-empty">
      <span class="big">📷⃠</span>
      No live feed detected — connect a camera/RTSP source and switch back to
      this mode, or use Synthetic render.
    </div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(58, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio || 1);
    document.body.appendChild(renderer.domElement);

    const ambient = new THREE.AmbientLight(0x334466, 0.6);
    scene.add(ambient);
    const key = new THREE.PointLight(0x88aaff, 1.2, 40);
    key.position.set(4, 3, 6);
    scene.add(key);

    const torus = new THREE.Mesh(
      new THREE.TorusGeometry(3, 1, 20, 120),
      new THREE.MeshBasicMaterial({ color: 0x4488ff, wireframe: true, transparent: true, opacity: 0.75 })
    );
    scene.add(torus);

    const plasma = new THREE.Mesh(
      new THREE.SphereGeometry(0.85, 40, 40),
      new THREE.MeshPhongMaterial({ color: 0xff5522, emissive: 0x441100, transparent: true, opacity: 0.72, shininess: 80 })
    );
    scene.add(plasma);

    // Layered additive glow shells act as a cheap bloom for the plasma core —
    // no postprocessing pipeline needed, three stacked shells with falling
    // opacity read as a soft glow at any camera distance.
    const glowInner = new THREE.Mesh(
      new THREE.SphereGeometry(1.0, 32, 32),
      new THREE.MeshBasicMaterial({ color: 0xff5500, transparent: true, opacity: 0.18, blending: THREE.AdditiveBlending, depthWrite: false })
    );
    scene.add(glowInner);
    const glowOuter = new THREE.Mesh(
      new THREE.SphereGeometry(1.35, 32, 32),
      new THREE.MeshBasicMaterial({ color: 0xff8800, transparent: true, opacity: 0.08, blending: THREE.AdditiveBlending, depthWrite: false })
    );
    scene.add(glowOuter);
    const glow = glowInner; // legacy alias used by scale-follow code below

    const oPoint = new THREE.Mesh(
      new THREE.SphereGeometry(0.14, 16, 16),
      new THREE.MeshBasicMaterial({ color: 0xff2244 })
    );
    scene.add(oPoint);

    const ring = new THREE.Mesh(
      new THREE.RingGeometry(0.22, 0.28, 32),
      new THREE.MeshBasicMaterial({ color: 0xff4466, side: THREE.DoubleSide, transparent: true, opacity: 0.8 })
    );
    oPoint.add(ring);

    // Divertor strike-point plates: a ring of small tiles around the lower
    // torus rim whose colour is driven by real heat-flux data (blue -> cyan
    // -> yellow -> red/white), like the divertor targets in a real tokamak.
    const DIVERTOR_COUNT = 24;
    const divertorPlates = [];
    const divertorGroup = new THREE.Group();
    for (let i = 0; i < DIVERTOR_COUNT; i++) {
      const angle = (i / DIVERTOR_COUNT) * Math.PI * 2;
      const plate = new THREE.Mesh(
        new THREE.BoxGeometry(0.34, 0.14, 0.5),
        new THREE.MeshStandardMaterial({ color: 0x2255aa, emissive: 0x001133, roughness: 0.55, metalness: 0.35 })
      );
      const r = 3.55;
      plate.position.set(Math.cos(angle) * r, -1.05, Math.sin(angle) * r);
      plate.lookAt(0, -1.05, 0);
      divertorGroup.add(plate);
      divertorPlates.push(plate);
    }
    scene.add(divertorGroup);

    // Heat-flux colour ramp: blue -> cyan -> yellow -> red -> white.
    const HEAT_STOPS = [
      { t: 0.0, c: new THREE.Color(0x1144aa) },
      { t: 0.35, c: new THREE.Color(0x22ccdd) },
      { t: 0.6, c: new THREE.Color(0xffdd33) },
      { t: 0.85, c: new THREE.Color(0xff3311) },
      { t: 1.0, c: new THREE.Color(0xffffff) },
    ];
    function heatColor(v) {
      const x = Math.min(1, Math.max(0, v));
      for (let i = 0; i < HEAT_STOPS.length - 1; i++) {
        const a = HEAT_STOPS[i];
        const b = HEAT_STOPS[i + 1];
        if (x >= a.t && x <= b.t) {
          const local = (x - a.t) / Math.max(1e-6, b.t - a.t);
          return a.c.clone().lerp(b.c, local);
        }
      }
      return HEAT_STOPS[HEAT_STOPS.length - 1].c.clone();
    }

    camera.position.set(0, 1.2, 8.5);
    camera.lookAt(0, 0, 0);

    let playing = true;
    document.getElementById('pause-btn').addEventListener('click', () => {
      playing = !playing;
      document.getElementById('pause-btn').textContent = playing ? 'Pause' : 'Resume';
    });

    // ---- Real-data bridge state (pushed from web_panel.py via runJavaScript) ----
    // Normalised [0,1] plasma intensity + per-plate heat samples, updated by
    // window.__fuselk_updateFrame(frame). Defaults keep the pre-existing
    // procedural look until the first real frame arrives.
    let heatIntensity = 0.45; // drives plasma glow brightness/colour
    let divertorHeat = new Array(DIVERTOR_COUNT).fill(0.3);
    let disruptionProb = 0;
    let lastDisruptionFlashAt = -1e9;
    const flashEl = document.getElementById('disruption-flash');
    const statusEl = document.getElementById('status-line');

    function flattenHeat(arr) {
      // raw_heat / controlled_heat arrive as a 2D grid (list of lists);
      // flatten defensively so this also tolerates a flat array.
      const out = [];
      const walk = (v) => {
        if (Array.isArray(v)) { v.forEach(walk); } else if (typeof v === 'number') { out.push(v); }
      };
      walk(arr);
      return out;
    }

    window.__fuselk_updateFrame = function (frame) {
      try {
        const flat = flattenHeat(frame.controlled_heat || frame.raw_heat || []);
        if (flat.length) {
          const max = Math.max(...flat, 1e-6);
          const mean = flat.reduce((s, v) => s + v, 0) / flat.length;
          heatIntensity = Math.min(1, mean / max);
          // Resample the flattened grid onto the divertor ring by nearest index.
          for (let i = 0; i < DIVERTOR_COUNT; i++) {
            const idx = Math.floor((i / DIVERTOR_COUNT) * flat.length);
            divertorHeat[i] = Math.min(1, (flat[idx] || 0) / max);
          }
        }
        if (typeof frame.disruption_probability === 'number') {
          disruptionProb = frame.disruption_probability;
          if (disruptionProb > 0.65) {
            lastDisruptionFlashAt = performance.now();
          }
        }
        if (statusEl) {
          const fusionPct = typeof frame.fusion_score === 'number' ? (frame.fusion_score * 100).toFixed(0) + '%' : '—';
          statusEl.textContent = `sim step ${frame.step ?? '—'} · fusion ${fusionPct} · disruption ${(disruptionProb * 100).toFixed(0)}%`;
        }
      } catch (err) {
        // Never let a malformed payload break the render loop.
        console.warn('fuselk: bad sim frame', err);
      }
    };

    // ---- Live video feed bridge ----
    const liveLayer = document.getElementById('live-layer');
    const liveVideo = document.getElementById('live-video');
    const liveEmpty = document.getElementById('live-empty');
    let currentMode = 'synthetic';
    let liveAvailable = false;

    function applyMode() {
      const showLive = currentMode === 'live';
      liveLayer.classList.toggle('active', showLive);
      renderer.domElement.style.visibility = showLive ? 'hidden' : 'visible';
      if (showLive) {
        liveEmpty.classList.toggle('show', !liveAvailable);
        liveVideo.style.display = liveAvailable ? 'block' : 'none';
      }
    }

    document.getElementById('mode-select').addEventListener('change', (ev) => {
      currentMode = ev.target.value;
      applyMode();
    });

    window.__fuselk_setLiveFrame = function (dataUrl) {
      liveAvailable = true;
      liveVideo.src = dataUrl;
      if (currentMode === 'live') applyMode();
    };

    window.__fuselk_setLiveStatus = function (available, statusText) {
      liveAvailable = !!available;
      if (statusEl && currentMode === 'live') {
        statusEl.textContent = 'live feed: ' + (statusText || (available ? 'active' : 'unavailable'));
      }
      applyMode();
    };

    let t0 = performance.now();
    let frames = 0;
    let fpsEl = document.getElementById('fps');
    let lastFpsT = performance.now();
    let lastT = 0;
    function animate(now) {
      requestAnimationFrame(animate);
      frames += 1;
      if (playing) lastT = now - t0;
      const t = lastT * 0.001;
      torus.rotation.y += 0.004;
      torus.rotation.x = Math.sin(t * 0.3) * 0.08;

      const pulse = 1 + Math.sin(t * 2.2) * 0.04;
      const heatScale = 0.9 + heatIntensity * 0.35;
      plasma.scale.setScalar(pulse * heatScale);
      glowInner.scale.copy(plasma.scale).multiplyScalar(1.15 + heatIntensity * 0.25);
      glowOuter.scale.copy(plasma.scale).multiplyScalar(1.55 + heatIntensity * 0.4);

      const plasmaColor = heatColor(0.3 + heatIntensity * 0.7);
      plasma.material.color.copy(plasmaColor);
      plasma.material.emissive.copy(plasmaColor).multiplyScalar(0.35 + heatIntensity * 0.4);
      glowInner.material.color.copy(plasmaColor);
      glowInner.material.opacity = 0.14 + heatIntensity * 0.22;
      glowOuter.material.color.copy(plasmaColor);
      glowOuter.material.opacity = 0.06 + heatIntensity * 0.14;

      for (let i = 0; i < DIVERTOR_COUNT; i++) {
        const c = heatColor(divertorHeat[i]);
        const mat = divertorPlates[i].material;
        mat.color.copy(c);
        mat.emissive.copy(c).multiplyScalar(0.25 + divertorHeat[i] * 0.5);
      }

      oPoint.position.x = 2.45 * Math.cos(t * 1.1);
      oPoint.position.y = 0.35 * Math.sin(t * 1.6);
      oPoint.position.z = 0.2 * Math.sin(t * 0.9);
      ring.lookAt(camera.position);

      // Disruption flash: brief radial red pulse that decays over ~700ms.
      const sinceFlash = now - lastDisruptionFlashAt;
      if (sinceFlash >= 0 && sinceFlash < 700) {
        flashEl.style.opacity = String(0.85 * (1 - sinceFlash / 700));
      } else {
        flashEl.style.opacity = '0';
      }

      if (now - lastFpsT >= 1000) {
        fpsEl.textContent = (frames * 1000 / (now - lastFpsT)).toFixed(0) + ' fps';
        frames = 0;
        lastFpsT = now;
      }
      renderer.render(scene, camera);
    }
    animate(t0);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
